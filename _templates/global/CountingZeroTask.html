{{ if ShowFeedback }}
    <div class="task-meta">
        <span>累计得分：<strong id="cumulative-score">0.00</strong></span>
    </div>
{{ endif }}

<section class="matrix-panel" aria-label="Counting Zero任务区">
    <div
        id="matrix"
        class="matrix"
        style="--matrix-size: {{ matrix_size }}"
        aria-label="{{ matrix_size }}乘{{ matrix_size }}的0和1矩阵"
    ></div>

    <p class="instructions">请计算矩阵中 0 的总数。提交后会立即出现一个新的随机矩阵。</p>

    <div class="task-status-row">
        <span class="question-status">
            题目：<strong id="question-number">1</strong>
        </span>
        <div id="task-timer-slot" class="task-timer-slot"></div>
    </div>

    <div class="answer-row">
        <label for="zero-answer">0 的数量：</label>
        <input
            id="zero-answer"
            class="form-control"
            type="number"
            min="0"
            max="225"
            step="1"
            inputmode="numeric"
            autocomplete="off"
        >
        <button id="submit-answer" type="button" class="btn btn-primary">提交</button>
    </div>

    <div id="feedback" aria-live="polite"></div>
</section>

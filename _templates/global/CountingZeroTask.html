{{ if ShowFeedback }}
    <div class="task-meta">
        <span>{{ t.cumulative_score }}：<strong id="cumulative-score">0.00</strong></span>
    </div>
{{ endif }}

<section class="matrix-panel" aria-label="{{ t.count_area }}">
    <div
        id="matrix"
        class="matrix"
        style="--matrix-size: {{ matrix_size }}"
        aria-label="{{ t.matrix_aria }}"
    ></div>

    <p class="instructions">{{ t.count_instructions }}</p>

    <div class="task-status-row">
        <span class="question-status">
            {{ t.question }}：<strong id="question-number">1</strong>
        </span>
        <div id="task-timer-slot" class="task-timer-slot"></div>
    </div>

    <div class="answer-row">
        <label for="zero-answer">{{ t.zero_count }}</label>
        <input
            id="zero-answer"
            class="form-control"
            type="number"
            min="0"
            max="225"
            step="1"
            inputmode="numeric"
            autocomplete="off"
        >
        <button id="submit-answer" type="button" class="btn btn-primary">{{ t.submit }}</button>
    </div>

    <div id="feedback" aria-live="polite"></div>
</section>

<aside class="chat-panel" aria-label="{{ t.ai_area }}">
    <h4>{{ t.ai_assistant }}</h4>
    <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
    <div class="chat-copy-toolbar">
        <span id="copy-status" aria-live="polite"></span>
        <button id="copy-matrix" type="button" class="btn btn-outline-secondary btn-sm">
            {{ CopyButtonText }}
        </button>
    </div>
    <div class="chat-input-row">
        <textarea
            id="chat-input"
            class="form-control"
            rows="1"
            placeholder="{{ t.message_placeholder }}"
            aria-label="{{ t.message_aria }}"
        ></textarea>
        <button id="chat-send" type="button" class="btn btn-primary">{{ t.send }}</button>
    </div>
    <div id="chat-status" class="chat-status" aria-live="polite"></div>
</aside>

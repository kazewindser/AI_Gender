{{ if ShowFeedback }}
    <div class="task-meta">
        <span>{{ t.cumulative_score }}：<strong id="cumulative-score">0.00</strong></span>
    </div>
{{ endif }}

<section class="stock-panel" aria-label="{{ t.stock_area }}">
    <div class="stock-chart-wrap">
        <svg id="stock-chart" class="stock-chart" viewBox="0 0 640 215" role="img" aria-label="{{ t.chart_aria }}"></svg>
    </div>

    <div class="series-data-box" aria-label="{{ t.series_aria }}">
        <div class="series-data-title">{{ t.series_title }}</div>
        <pre id="stock-series-data" class="series-data-values"></pre>
    </div>

    <p class="instructions">
        {{ t.forecast_instructions }}
    </p>

    <div class="task-status-row">
        <span class="question-status">{{ t.question }}：<strong id="question-number">1</strong></span>
        <div id="task-timer-slot" class="task-timer-slot"></div>
    </div>

    <div class="answer-row">
        <label for="forecast-answer">{{ t.forecast_price }}</label>
        <input
            id="forecast-answer"
            class="form-control"
            type="number"
            min="0.01"
            step="0.01"
            inputmode="decimal"
            autocomplete="off"
        >
        <button id="submit-answer" type="button" class="btn btn-primary">{{ t.submit }}</button>
    </div>

    <div id="feedback" aria-live="polite"></div>
</section>

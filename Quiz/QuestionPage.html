{{ block title }}
    {{ quiz_text.question }} {{ question_num }} / {{ question_count }}
{{ endblock }}

{{ block content }}

<div style="margin: 20px 0;">

    <p style="font-size: 1.1em; margin: 20px 0;">{{ question_text }}</p>

    <div style="margin: 20px 0;">
        {{ for value, label in choices }}
            <div style="margin: 10px 0;">
                <label style="cursor: pointer; display: block; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                    <input type="radio" name="answer" value="{{ value }}" required style="margin-right: 10px;">
                    {{ label }}
                </label>
            </div>
        {{ endfor }}
    </div>

    <details style="margin: 20px 0;">
        <summary style="cursor: pointer; color: #0d6efd;">{{ quiz_text.view_instructions }}</summary>
        <div style="margin-top: 15px;">
            <iframe src="{{ slides_url }}?start=false&loop=false&delayms=30000"
                    title="{{ quiz_text.instructions_title }}"
                    frameborder="0"
                    width="100%"
                    height="600"
                    allowfullscreen="true"
                    mozallowfullscreen="true"
                    webkitallowfullscreen="true">
            </iframe>
        </div>
    </details>

    {{ next_button }}

</div>

{{ endblock }}
